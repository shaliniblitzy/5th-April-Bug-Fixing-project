[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    metering: Tests for /runs/metering endpoint
    current_metering: Tests for /runs/metering/current endpoint
    project: Tests for /project endpoint
    consistency: Cross-endpoint consistency tests
    edge_cases: Edge case and boundary tests
addopts = -v --tb=short
